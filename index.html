}

}

<script type="module">const bins = JSON.parse(document.getElementById("page-count-data").textContent);
const host = document.getElementById("page-count-chart");
const tooltip = document.getElementById("page-count-tooltip");
const numbers = new Intl.NumberFormat("en");
const ns = "http://www.w3.org/2000/svg";
const left = 42, right = 539, top = 26, bottom = 132;
const lastPage = bins.at(-1).end;
const peak = Math.max(...bins.map(({papers}) => papers));
const ymax = Math.ceil(peak / 200) * 200;
const x = (pages) => left + (right - left) * pages / lastPage;
const y = (papers) => bottom - (bottom - top) * papers / ymax;

function svg(tag, attrs = {}, label) {
  const node = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (label !== undefined) node.textContent = label;
  return node;
}

const graph = svg("svg", {viewBox: "0 0 556 180", role: "group",
  "aria-label": "Papers per 10-page interval. Use arrow keys to explore."});
graph.append(svg("text", {x: left, y: 16, class: "chart-axis"}, "Papers"));
for (let papers = 0; papers <= ymax; papers += ymax / 2) {
  graph.append(
    svg("line", {x1: left, x2: right, y1: y(papers), y2: y(papers), class: "chart-grid"}),
    svg("text", {x: left - 7, y: y(papers) + 4, "text-anchor": "end", class: "chart-axis"}, numbers.format(papers))
  );
}
for (let pages = 0; pages <= lastPage; pages += 40) {
  const minor = pages % 80 !== 0 && pages !== lastPage ? " chart-tick-minor" : "";
  graph.append(svg("text", {x: x(pages), y: 151, "text-anchor": pages === lastPage ? "end" : "middle",
    class: "chart-axis" + minor}, pages));
}
const center = ({start, end}) => (start - 1 + end) / 2;
const points = bins.map((bin) => `${x(center(bin))},${y(bin.papers)}`).join(" ");
graph.append(
  svg("polygon", {points: `${x(center(bins[0]))},${bottom} ${points} ${x(center(bins.at(-1)))},${bottom}`, class: "chart-area"}),
  svg("polyline", {points, class: "chart-line"}),
  svg("text", {x: (left + right) / 2, y: 173, "text-anchor": "middle", class: "chart-axis"}, "PDF pages")
);

const point = svg("circle", {r: 3.8, class: "chart-dot is-active", "aria-hidden": "true", visibility: "hidden"});
graph.append(point);
const hits = [];
const paperCount = (count) => `${numbers.format(count)} ${count === 1 ? "paper" : "papers"}`;
function show(bin) {
  point.setAttribute("cx", x(center(bin)));
  point.setAttribute("cy", y(bin.papers));
  point.setAttribute("visibility", "visible");
  tooltip.textContent = `${paperCount(bin.papers)} · ${bin.start}–${bin.end} pages`;
  tooltip.hidden = false;
}
function hide() {
  point.setAttribute("visibility", "hidden");
  tooltip.hidden = true;
}
bins.forEach((bin, i) => {
  const hit = svg("rect", {x: x(bin.start - 1), y: top, width: x(bin.end) - x(bin.start - 1),
    height: bottom - top, class: "chart-hit", tabindex: i === 0 ? 0 : -1,
    "aria-label": `${bin.start}–${bin.end} pages: ${paperCount(bin.papers)}`});
  hits.push(hit);
  hit.addEventListener("pointerenter", () => show(bin));
  hit.addEventListener("click", () => show(bin));
  hit.addEventListener("focus", () => show(bin));
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (event) => {
    let next;
    if (event.key === "ArrowLeft") next = Math.max(0, i - 1);
    else if (event.key === "ArrowRight") next = Math.min(bins.length - 1, i + 1);
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = bins.length - 1;
    else if (event.key === "Escape") { hide(); return; }
    else return;
    event.preventDefault();
    hit.setAttribute("tabindex", "-1");
    hits[next].setAttribute("tabindex", "0");
    hits[next].focus();
  });
  graph.append(hit);
});
graph.addEventListener("pointerleave", () => {
  const index = hits.indexOf(document.activeElement);
  if (index < 0) hide();
  else show(bins[index]);
});
host.append(graph);
</script>
